[package]
name = "scrivon"
version = "1.5.0"
description = "Local-first editor for Mermaid diagrams and Markdown"
authors = ["Jamie Fairweather"]
license = "MIT"
homepage = "https://github.com/Jamie-Fairweather/scrivon"
repository = "https://github.com/Jamie-Fairweather/scrivon"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diagram_app_lib"
# Only rlib, which is all a desktop build uses. The Tauri template's "staticlib" (iOS) and "cdylib"
# (Android) made every build also write a big static library (~160 MB in release, ~1.2 GB in debug)
# and link an unused DLL. Add them back for mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# watch: lets the app notice files changed by other programs (D10).
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.42+ fixes RUSTSEC-2026-0187 (stack overflow on deeply nested PDFs).
lopdf = "0.47"
base64 = "0.23"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-prevent-default = { version = "6.0.1", features = ["platform-windows"] }
font-kit = "0.14.3"
# Deleting moves files and folders to the Recycle Bin, so a mistake can be undone (F01).
trash = "5.3.0"
# A log file to attach to bug reports (F25).
tauri-plugin-log = "2"
log = "0.4"

# Page stamping parses every PDF content stream. lopdf's parser is the slow
# part of export in debug builds; optimize just that crate.
[profile.dev.package.lopdf]
opt-level = 3

# Shipped builds. strip makes the exe and update downloads smaller. No whole-program optimisation
# (lto = true with codegen-units = 1): it took 4-6 minutes of every release build, and measured in
# November 2026 it only made the setup.exe 0.9% smaller (about 100 KB). opt-level stays 3 so PDF page
# stamping stays fast. panic stays "unwind" on purpose: a panic in lopdf or font-kit then fails that
# one export instead of closing the app with unsaved tabs.
[profile.release]
codegen-units = 16
lto = "off"
opt-level = 3
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# One Scrivon process at a time, so two windows can't overwrite each other's files and sessions (B60, D20).
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

