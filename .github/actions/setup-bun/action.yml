name: Setup Bun and dependencies
description: Install Bun with dependency and Next.js build caches

runs:
    using: composite
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
          with:
              # Same Bun as local development: keep in step with "packageManager" in package.json.
              bun-version: 1.4.2

        - name: Cache Bun dependencies
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  ~/.bun/install/cache
                  node_modules
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  bun-${{ runner.os }}-

        - name: Cache Next.js build
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: .next/cache
              key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('next.config.mjs', 'postcss.config.mjs', 'tsconfig.json', 'app/**', 'components/**', 'hooks/**', 'lib/**', 'scripts/**') }}
              restore-keys: |
                  next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
                  next-${{ runner.os }}-

        - name: Install dependencies
          run: bun install --frozen-lockfile
          shell: bash
