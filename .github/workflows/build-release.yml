# Manual re-run for releases that were published before the Windows build job existed,
# when the Windows build failed and left the release as a draft (this publishes it),
# or when you need to rebuild installers without a new version bump. It builds the tag's
# own code (only the build tooling comes from this commit), so after a failed build it only
# helps when the cause was outside the code, such as a secret or the runner.
name: Build release artifacts (manual)

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to build (e.g. v1.0.0)'
                required: true
                type: string

# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current)
# because this job holds the updater signing key.
permissions:
    contents: write

jobs:
    # One installer per architecture, as in release.yml. The ARM64 one is cross-compiled on the
    # x64 runner.
    build-windows:
        name: Build Windows installer (${{ matrix.arch }})
        runs-on: windows-latest
        strategy:
            # One at a time: each build reads latest.json from the release, adds its own installer
            # and uploads it again, so two at once would drop one of them.
            max-parallel: 1
            # Same as CI's installer check (ci.yml bundle-windows), whose caches these builds read.
            matrix:
                include:
                    - arch: x64
                      target: x86_64-pc-windows-msvc
                    - arch: arm64
                      target: aarch64-pc-windows-msvc
        steps:
            # The tag is typed by hand and reaches every later step, which hold the signing key.
            # Anything but a release tag stops the run here.
            - name: Check the tag
              shell: bash
              run: |
                  pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
                  if [[ ! "${TAG}" =~ $pattern ]]; then
                    echo "::error::The tag must be a release tag like v1.2.3 or v1.2.3-rc.1."
                    exit 1
                  fi
              env:
                  TAG: ${{ inputs.tag }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag }}
                  persist-credentials: false

            # The app is built from the tag, but the build tooling comes from this workflow's own
            # commit. An older tag's copy of the setup action uses unpinned actions and Bun, which
            # would run in the same job as the signing key.
            - name: Checkout release tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: .release-tools
                  sparse-checkout: |
                      .github/actions
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.release-tools/.github/actions/setup-bun

            # The version CI checks the Windows code with (ci.yml): bump them together.
            - name: Install Rust 1.97.1
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: 1.97.1
                  targets: ${{ matrix.target }}

            # Dev's compiled crates, as in release.yml. An older tag with a different Cargo.lock or
            # Cargo.toml gets a partial match and Cargo rebuilds what changed. Read-only, so an old
            # tag's crates never end up in dev's cache.
            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target
                  shared-key: windows-release-${{ matrix.arch }}
                  save-if: false

            - name: Get release ID
              id: gh_release
              shell: bash
              run: |
                  # gh release view also finds drafts; the releases/tags API does not.
                  read -r id draft prerelease < <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId,isDraft,isPrerelease --jq '"\(.databaseId) \(.isDraft) \(.isPrerelease)"')
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  echo "draft=$draft" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag }}

            - name: Build and upload the installer
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: src-tauri
                  tauriScript: bun run tauri
                  releaseId: ${{ steps.gh_release.outputs.id }}
                  tagName: ${{ inputs.tag }}
                  releaseDraft: false
                  prerelease: ${{ steps.gh_release.outputs.prerelease == 'true' }}
                  # The updater never downloads the .sig files: their signature is already inside latest.json.
                  uploadUpdaterSignatures: false
                  # Only the per-user setup.exe ships. Explicit, so rebuilding an older tag (whose config
                  # still builds every target) doesn't add an MSI, or fail on one for an rc version.
                  args: --target ${{ matrix.target }} --bundles nsis

    # Once both installers are on the release, and only when both builds passed (which also
    # means the tag passed the check above).
    publish:
        name: Publish the release
        needs: build-windows
        if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            # The script comes from this workflow's own commit, like the build tooling above.
            - name: Checkout release tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: scripts/patch-updater-manifest.mjs
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Get release ID
              id: gh_release
              shell: bash
              run: |
                  # gh release view also finds drafts; the releases/tags API does not.
                  read -r id draft prerelease < <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId,isDraft,isPrerelease --jq '"\(.databaseId) \(.isDraft) \(.isPrerelease)"')
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  echo "draft=$draft" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag }}

            # Fails, leaving the release a draft, if latest.json lacks either installer.
            - name: Check updater manifest and add release notes
              shell: bash
              run: node scripts/patch-updater-manifest.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ inputs.tag }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            # Last step: until now the release was a draft (release.config.mjs), so neither the
            # Releases page nor the updater's releases/latest/download/latest.json could see it
            # without its installers. make_latest=legacy only makes it 'latest' if it is the newest
            # stable version, so publishing an older draft never moves 'latest' backwards.
            - name: Publish the release
              if: steps.gh_release.outputs.draft == 'true'
              shell: bash
              run: |
                  if [ "$PRERELEASE" = "true" ]; then
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --silent
                  else
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=legacy --silent
                  fi
                  echo "Published ${TAG}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.gh_release.outputs.id }}
                  PRERELEASE: ${{ steps.gh_release.outputs.prerelease }}
                  TAG: ${{ inputs.tag }}
