name: CI

on:
    pull_request:
    push:
        branches: [dev]
    # release.yml runs these same checks before it tags or publishes anything.
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Lint, build, and test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run typecheck

            - name: Build Next.js app
              run: bun run build

            # The build regenerates these and always ships the fresh copy. A diff only means the
            # committed copy is stale (for example after a Dependabot bump), so this warns instead of failing.
            - name: Check generated files are committed
              shell: bash
              run: |
                  if ! git diff --quiet -- lib/legal/third-party-licenses.ts lib/examples; then
                    git diff --stat -- lib/legal/third-party-licenses.ts lib/examples
                    echo "::warning title=Generated files are out of date::Run 'bun run build' and commit lib/legal/third-party-licenses.ts and lib/examples."
                  fi

            - name: Test with coverage
              run: bun run test:coverage

            # Only for pushes to dev, not when release.yml calls this for main or rc.
            - name: Upload coverage to Codecov
              if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
              with:
                  files: coverage/lcov.info
                  flags: frontend
                  use_oidc: true
                  fail_ci_if_error: true

    rust:
        name: Rust tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libglib2.0-dev \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libssl-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target

            # --locked: fail when Cargo.lock is out of date instead of quietly rewriting it.
            - name: Test
              run: cargo test --locked
              working-directory: src-tauri

    # Windows is the main platform. The WebView2 PDF exporter and the Windows shortcut
    # blocking are #[cfg(windows)], so the Linux job above never compiles them.
    rust-windows:
        name: Rust tests (Windows)
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable
                  components: clippy

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target

            - name: Clippy
              run: cargo clippy --all-targets --locked
              working-directory: src-tauri

            - name: Test
              run: cargo test --locked
              working-directory: src-tauri

    # Catches Windows path handling (backslashes, drive letters) that POSIX-only runs miss.
    frontend-windows:
        name: Unit tests (Windows)
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            - name: Test
              run: bun run test:run
