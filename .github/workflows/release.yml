name: Release

on:
    push:
        branches:
            - main
            - rc

# One release at a time per branch; a second push while running queues (no cancel).
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# Every job sets its own permissions. Third-party actions are pinned to full commit SHAs
# (Dependabot keeps them current) because these jobs hold the updater signing key and the release PAT.
permissions:
    contents: read

jobs:
    # The same checks as a pull request (ci.yml), on the commit being released. Nothing is
    # tagged or released unless they pass, including for a direct push to main or rc.
    verify:
        name: CI checks
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            id-token: write

    release:
        name: semantic-release
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            published: ${{ steps.semrel.outputs.new_release_published }}
            version: ${{ steps.semrel.outputs.new_release_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            # semantic-release 25 runs on Node (its bin has a node shebang) and exits at once on
            # anything older than 22.14, so don't rely on whichever Node the runner image ships.
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # Runs the semantic-release version locked in bun.lock (no install at run time).
            # On a release, the exec plugin's successCmd writes new_release_published and
            # new_release_version to this step's outputs (scripts/write-release-outputs.mjs).
            - name: Run semantic-release
              id: semrel
              run: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
                  HUSKY: 0

    # The outputs are only written in semantic-release's success phase, after the tag and the
    # draft exist. A later success step (commenting on and labelling pull requests and issues)
    # can still fail the release job, so the installers are built whenever the outputs say a
    # release was made, not only when that job passed. Re-running a failed release job finds
    # the tag and makes no new release, so it would never build them.
    build-windows:
        name: Build Windows installers
        needs: release
        if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: v${{ needs.release.outputs.version }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            # The version CI checks the Windows code with (ci.yml): bump them together.
            - name: Install Rust 1.97.1
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: 1.97.1

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target

            - name: Get release ID
              id: gh_release
              shell: bash
              run: |
                  tag="v${VERSION}"
                  # gh release view also finds drafts; the releases/tags API does not.
                  read -r id draft prerelease < <(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json databaseId,isDraft,isPrerelease --jq '"\(.databaseId) \(.isDraft) \(.isPrerelease)"')
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  echo "draft=$draft" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}

            - name: Build and upload installers
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: src-tauri
                  tauriScript: bun run tauri
                  releaseId: ${{ steps.gh_release.outputs.id }}
                  tagName: v${{ needs.release.outputs.version }}
                  releaseDraft: false
                  prerelease: ${{ steps.gh_release.outputs.prerelease == 'true' }}
                  # Only the per-user setup.exe ships. An MSI next to it installed a second, per-machine copy.
                  args: --bundles nsis

            - name: Add release notes to updater manifest
              shell: bash
              run: node scripts/patch-updater-manifest.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            # Last step: until now the release was a draft (release.config.mjs), so neither the
            # Releases page nor the updater's releases/latest/download/latest.json could see it
            # without its installers. make_latest=legacy only makes it 'latest' if it is the newest
            # stable version, so publishing an older draft never moves 'latest' backwards.
            - name: Publish the release
              if: steps.gh_release.outputs.draft == 'true'
              shell: bash
              run: |
                  if [ "$PRERELEASE" = "true" ]; then
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --silent
                  else
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=legacy --silent
                  fi
                  echo "Published v${VERSION}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.gh_release.outputs.id }}
                  PRERELEASE: ${{ steps.gh_release.outputs.prerelease }}
                  VERSION: ${{ needs.release.outputs.version }}
