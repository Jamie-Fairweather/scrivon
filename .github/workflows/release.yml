name: Release

on:
    push:
        branches:
            - main
            - rc

# One release at a time per branch; a second push while running queues (no cancel).
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# Every job sets its own permissions. Third-party actions are pinned to full commit SHAs
# (Dependabot keeps them current) because these jobs hold the updater signing key and the release PAT.
permissions:
    contents: read

jobs:
    # semantic-release pushes its `chore(release): ...` commit with the PAT, so that push starts this
    # workflow again. Once the release's tag points at that commit there is nothing left to do, so every
    # later job is skipped. Without the tag (the release stopped after pushing the commit), the run goes
    # on as usual and semantic-release finishes the release. Only when that commit is the whole push:
    # fast-forwarding main to rc's tip (docs/development.md) pushes more commits, so it still releases.
    #
    # Otherwise this looks for a push run of ci.yml on dev that passed with exactly the same files (the
    # same git tree) as the commit being released. Merging dev into rc right after the backmerge gives
    # that tree, and dev's run has just passed every job verify would run, installer build included.
    # When there's no such run, or a lookup fails, verify runs the checks itself.
    gate:
        name: Look for passing CI checks
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        outputs:
            ci_run: ${{ steps.find.outputs.ci_run }}
            released: ${{ steps.find.outputs.released }}
        steps:
            - name: Find a passing dev CI run with the same files
              id: find
              shell: bash
              run: |
                  if [ "$RELEASE_COMMIT" = "true" ]; then
                    tags=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --paginate --jq '.[].object.sha') || tags=''
                    if grep -qxF "$GITHUB_SHA" <<< "$tags"; then
                      echo "released=true" >> "$GITHUB_OUTPUT"
                      echo "semantic-release's release commit, already tagged: nothing to check or release." | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                  fi

                  # A failed lookup only means the CI checks run again.
                  if ! run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=dev&event=push&status=success&per_page=20" \
                    --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "dev" and .conclusion == "success" and .head_commit.tree_id == env.TREE)][0].id // empty'); then
                    echo "Couldn't look up dev's CI runs, so the CI checks run here." | tee -a "$GITHUB_STEP_SUMMARY"
                  elif [ -n "$run_id" ]; then
                    echo "ci_run=$run_id" >> "$GITHUB_OUTPUT"
                    echo "These files already passed CI in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}, so the CI checks are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    echo "None of dev's last 20 passing push runs has these files, so the CI checks run here." | tee -a "$GITHUB_STEP_SUMMARY"
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
                  TREE: ${{ github.event.head_commit.tree_id }}
                  RELEASE_COMMIT: >-
                      ${{ github.event.head_commit.author.email == 'semantic-release-bot@martynus.net'
                      && startsWith(github.event.head_commit.message, 'chore(release): ')
                      && !github.event.commits[1] }}

    # The checks a push to dev runs (ci.yml, including the installer build that pull requests skip), on
    # the commit being released, unless the gate found they already passed on the same files. Nothing
    # is tagged or released unless one of the two passed, including for a direct push to main or rc.
    # If the gate job itself fails, this still runs.
    verify:
        name: CI checks
        needs: gate
        if: ${{ !cancelled() && !needs.gate.outputs.released && !needs.gate.outputs.ci_run }}
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            id-token: write

    # Spelled out because verify can be skipped, and a skipped job's dependants are otherwise skipped too.
    # `!cancelled()` alone would also run after a failed verify, so its result is checked as well.
    release:
        name: semantic-release
        needs: [gate, verify]
        if: >-
            ${{ !cancelled() && (needs.verify.result == 'success'
            || (needs.verify.result == 'skipped' && needs.gate.result == 'success' && needs.gate.outputs.ci_run)) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            published: ${{ steps.semrel.outputs.new_release_published }}
            version: ${{ steps.semrel.outputs.new_release_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            # semantic-release 25 runs on Node (its bin has a node shebang) and exits at once on
            # anything older than 22.14, so don't rely on whichever Node the runner image ships.
            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            # Runs the semantic-release version locked in bun.lock (no install at run time).
            # On a release, the exec plugin's successCmd writes new_release_published and
            # new_release_version to this step's outputs (scripts/write-release-outputs.mjs).
            - name: Run semantic-release
              id: semrel
              run: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
                  HUSKY: 0

    # The outputs are only written in semantic-release's success phase, after the tag and the
    # draft exist. A later success step (commenting on and labelling pull requests and issues)
    # can still fail the release job, so the installers are built whenever the outputs say a
    # release was made, not only when that job passed. Re-running a failed release job finds
    # the tag and makes no new release, so it would never build them.
    build-windows:
        name: Build Windows installers
        needs: release
        if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: v${{ needs.release.outputs.version }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            # The version CI checks the Windows code with (ci.yml): bump them together.
            - name: Install Rust 1.97.1
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: 1.97.1

            # The crates dev's installer check compiled (ci.yml bundle-windows, same shared-key), so only
            # the app itself is built here. Read-only: a copy saved on rc or main was gone by the next
            # release anyway (unused caches are dropped after 7 days).
            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target
                  shared-key: windows-release
                  save-if: false

            - name: Get release ID
              id: gh_release
              shell: bash
              run: |
                  tag="v${VERSION}"
                  # gh release view also finds drafts; the releases/tags API does not.
                  read -r id draft prerelease < <(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json databaseId,isDraft,isPrerelease --jq '"\(.databaseId) \(.isDraft) \(.isPrerelease)"')
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  echo "draft=$draft" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}

            - name: Build and upload installers
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: src-tauri
                  tauriScript: bun run tauri
                  releaseId: ${{ steps.gh_release.outputs.id }}
                  tagName: v${{ needs.release.outputs.version }}
                  releaseDraft: false
                  prerelease: ${{ steps.gh_release.outputs.prerelease == 'true' }}
                  # Only the per-user setup.exe ships. An MSI next to it installed a second, per-machine copy.
                  args: --bundles nsis

            - name: Add release notes to updater manifest
              shell: bash
              run: node scripts/patch-updater-manifest.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            # Last step: until now the release was a draft (release.config.mjs), so neither the
            # Releases page nor the updater's releases/latest/download/latest.json could see it
            # without its installers. make_latest=legacy only makes it 'latest' if it is the newest
            # stable version, so publishing an older draft never moves 'latest' backwards.
            - name: Publish the release
              if: steps.gh_release.outputs.draft == 'true'
              shell: bash
              run: |
                  if [ "$PRERELEASE" = "true" ]; then
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --silent
                  else
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=legacy --silent
                  fi
                  echo "Published v${VERSION}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.gh_release.outputs.id }}
                  PRERELEASE: ${{ steps.gh_release.outputs.prerelease }}
                  VERSION: ${{ needs.release.outputs.version }}
