name: Release

on:
    push:
        branches:
            - main
            - rc

# One release at a time per branch; a second push while running queues (no cancel).
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# Every job sets its own permissions. Third-party actions are pinned to full commit SHAs
# (Dependabot keeps them current) because these jobs hold the updater signing key and the release PAT.
permissions:
    contents: read

jobs:
    release:
        name: semantic-release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            published: ${{ steps.semrel.outputs.new_release_published }}
            version: ${{ steps.semrel.outputs.new_release_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            # Runs the semantic-release version locked in bun.lock (no install at run time).
            # On a release, the exec plugin's successCmd writes new_release_published and
            # new_release_version to this step's outputs (scripts/write-release-outputs.mjs).
            - name: Run semantic-release
              id: semrel
              run: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
                  HUSKY: 0

    build-windows:
        name: Build Windows installers
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: v${{ needs.release.outputs.version }}
                  persist-credentials: false

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup-bun

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri -> target

            - name: Get release ID
              id: gh_release
              shell: bash
              run: |
                  tag="v${VERSION}"
                  id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)
                  prerelease=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .prerelease)
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
                  # WiX/MSI only supports numeric pre-release segments (e.g. 1.0.0-1), not 1.0.0-rc.1
                  if [ "$prerelease" = "true" ] || echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
                    echo "bundles=nsis" >> "$GITHUB_OUTPUT"
                  else
                    echo "bundles=msi,nsis" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}

            - name: Build and upload installers
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: src-tauri
                  tauriScript: bun run tauri
                  releaseId: ${{ steps.gh_release.outputs.id }}
                  tagName: v${{ needs.release.outputs.version }}
                  releaseDraft: false
                  prerelease: ${{ steps.gh_release.outputs.prerelease == 'true' }}
                  args: --bundles ${{ steps.gh_release.outputs.bundles }}

            - name: Add release notes to updater manifest
              shell: bash
              run: node scripts/patch-updater-manifest.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
